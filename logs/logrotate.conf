"logs/access.log" {
    # logrotate 3.19 (Ubuntu 22.04) is before 'rotate -1' was added to keep everything.
    rotate 9999
    compress
    delaycompress
    prerotate
        docker compose exec -T proxy nginx -t
    endscript
    postrotate
        docker compose exec -T proxy nginx -s reopen
    endscript
}
