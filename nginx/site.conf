## Nginx configuration for default static site
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # Enable auto-indexing directories without an index.html
    #
    # Test with http://localhost/assets/
    gzip on;
    autoindex on;
    # Use human-readable sizes
    autoindex_exact_size off;
    sendfile on;
    sendfile_max_chunk 1m;
    tcp_nopush on;

    ## Rewrite URIs and resolve to HTML files
    #
    # This is surprisingly tricky to get right. Complications:
    # * Removing trailing slashes breaks autoindex for directories
    # * The try_files order matters
    # * The try_files rules require no trailing slash to successfully find the $uri.html files
    # * Not wanting $uri/index to be valid
    #   * I want it to either 404, or redirect to $uri
    # * rewrite directives stops processing immediately on permanent or redirect (or other) flags.
    #
    # So I have the ./scripts/check-redirect.sh script:
    #
    #    $ ./scripts/check-redirects.sh
    #    URL                                           Resolved URL                       HTTP Status
    #    http://localhost                              http://localhost/                  200
    #    http://localhost/                             http://localhost/                  200
    #    http://localhost/index.html                   http://localhost/                  200
    #    http://localhost/index                        http://localhost/index             200      # not sure what to do with /index URIs
    #    http://localhost/css                          http://localhost/css/              200
    #    http://localhost/css/                         http://localhost/css/              200
    #    http://localhost/css/index.html               http://localhost/css/              200
    #    http://localhost/vim                          http://localhost/vim               200
    #    http://localhost/vim/                         http://localhost/vim/              200      # trailing / not removed
    #    http://localhost/vim/index.html               http://localhost/vim/              200
    #    http://localhost/vim/index                    http://localhost/vim/index         200
    #    http://localhost/vim.html                     http://localhost/vim               200
    #    http://localhost/vim/text-objects             http://localhost/vim/text-objects  200
    #    http://localhost/vim/text-objects/            http://localhost/vim/text-objects  200
    #    http://localhost/vim/text-objects.html        http://localhost/vim/text-objects  200
    #    http://localhost/vim/text-objects/index.html  http://localhost/vim/text-objects  200
    #    http://localhost/graphviz                     http://localhost/graphviz          200
    #    http://localhost/graphviz/                    http://localhost/graphviz          200
    #    http://localhost/graphviz.html                http://localhost/graphviz          200
    #    http://localhost/graphviz/index.html          http://localhost/graphviz          200
    #    http://localhost/404.html                     http://localhost/404               404

    ## Remove index.html for URIs
    #
    # localhost/index.html -> localhost
    # localhost/page/index.html -> localhost/page
    #
    # try_files $uri/index.html
    rewrite ^(.*)index\.html$ $1 permanent;

    ## Remove .html extensions
    #
    # localhost/page.html -> localhost/page
    rewrite ^(.*)\.html$ $1 permanent;

    ## Remove trailing slashes only if the URI is a file
    #
    # If we always removed trailing slashes, that'd break autoindex'd directories.
    # But we need to remove trailing slashes for files so that e.g., 'localhost/page/' can
    # resolve to 'localhost/page.html' via try_files (otherwise it'd try 'localhost/page/.html',
    # which doesn't exist).
    #
    # Conditional is checked after rewrite phase, but before try_files phase.
    if (!-d $request_filename) {
        rewrite ^(.*)/$ $1 permanent;
    }

    location / {
        try_files $uri.html $uri/index.html $uri $uri/ =404;
    }
}
